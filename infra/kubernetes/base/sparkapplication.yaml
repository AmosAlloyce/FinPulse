apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: finpulse-streaming
  namespace: finpulse
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: ACCOUNT_ID.dkr.ecr.af-south-1.amazonaws.com/finpulse-spark:latest
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/finpulse/src/finpulse/streaming/spark_job.py
  sparkVersion: 3.5.3
  restartPolicy:
    type: Always
    onFailureRetries: 3
    onFailureRetryInterval: 10
  driver:
    cores: 1
    memory: 1024m
    serviceAccount: finpulse
    envFrom:
      - configMapRef: {name: finpulse-config}
      - secretRef: {name: finpulse-secrets}
  executor:
    instances: 3
    cores: 1
    memory: 1536m
    envFrom:
      - configMapRef: {name: finpulse-config}
      - secretRef: {name: finpulse-secrets}
  dynamicAllocation:
    enabled: true
    initialExecutors: 2
    minExecutors: 2
    maxExecutors: 10

