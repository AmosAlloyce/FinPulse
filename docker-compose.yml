name: finpulse

x-app-environment: &app-environment
  FINPULSE_ENV: ${FINPULSE_ENV:-development}
  FINPULSE_LOG_LEVEL: ${FINPULSE_LOG_LEVEL:-INFO}
  FINPULSE_RANDOM_SEED: ${FINPULSE_RANDOM_SEED:-42}
  FINPULSE_COUNTRIES: ${FINPULSE_COUNTRIES:-KEN,UGA,GHA,TZA,ZMB}
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  KAFKA_RAW_TOPIC: finpulse.events.raw.v1
  KAFKA_DLQ_TOPIC: finpulse.events.dlq.v1
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-finpulse}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-finpulse-secret}
  AWS_REGION: ${AWS_REGION:-af-south-1}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: finpulse-lakehouse
  WAREHOUSE_DSN: postgresql://finpulse:finpulse@postgres:5432/finpulse

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: finpulse
      POSTGRES_PASSWORD: finpulse
      POSTGRES_DB: finpulse
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpulse -d finpulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["8080:8080"]
    depends_on:
      redpanda:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: finpulse
      MINIO_ROOT_PASSWORD: finpulse-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 finpulse finpulse-secret &&
      mc mb --ignore-existing local/finpulse-lakehouse &&
      mc anonymous set download local/finpulse-lakehouse/demo"

  producer:
    build:
      context: .
      target: producer
    environment:
      <<: *app-environment
      DEMO_EVENT_RATE: ${DEMO_EVENT_RATE:-20}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  stream-processor:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    environment:
      <<: *app-environment
      SPARK_CHECKPOINT_LOCATION: s3a://finpulse-lakehouse/checkpoints/credit-events-v1
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment: *app-environment
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      target: dashboard
    environment:
      <<: *app-environment
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.8.2
    profiles: ["orchestration"]
    environment:
      DBT_HOST: postgres
      DBT_USER: finpulse
      DBT_PASSWORD: finpulse
      DBT_DATABASE: finpulse
      DBT_SCHEMA: analytics
    volumes: ["./dbt:/usr/app/dbt"]
    working_dir: /usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    profiles: ["orchestration"]
    environment: &airflow-environment
      <<: *app-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://finpulse:finpulse@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: finpulse-local-secret
      AIRFLOW_CONN_FINPULSE_WAREHOUSE: postgresql://finpulse:finpulse@postgres:5432/finpulse
      DBT_HOST: postgres
      DBT_USER: finpulse
      DBT_PASSWORD: finpulse
      DBT_DATABASE: finpulse
      DBT_SCHEMA: analytics
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Data --lastname Engineer --role Admin --email admin@finpulse.local || true"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    profiles: ["orchestration"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    profiles: ["orchestration"]
    environment: *airflow-environment
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs
    command: webserver
    ports: ["8088:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["observability"]
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
  minio-data:
  airflow-logs:
