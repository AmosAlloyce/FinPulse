[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "finpulse-data-platform"
version = "1.0.0"
description = "Production-style batch and streaming fintech data platform portfolio project"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Portfolio Project" }]
dependencies = [
  "boto3>=1.34,<2",
  "confluent-kafka>=2.5,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.21,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-json-logger>=2.0,<4",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.3", "pyarrow>=17,<26"]
dashboard = ["streamlit>=1.39,<2", "pandas>=2.2,<3", "plotly>=5.24,<6"]
dev = [
  "mypy>=1.12,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "testcontainers[kafka,postgres]>=4.8,<5",
]

[project.scripts]
finpulse = "finpulse.cli:main"
finpulse-producer = "finpulse.producer:main"
finpulse-api = "finpulse.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/finpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: tests requiring Docker or external services"]

[tool.coverage.run]
source = ["finpulse"]
branch = true
omit = [
  "*/api/*",
  "*/batch/*",
  "*/dashboard/*",
  "*/producer.py",
  "*/streaming/*",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
"src/finpulse/dashboard/app.py" = ["E501", "RUF001"]
