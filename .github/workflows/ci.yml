name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests airflow/dags
      - run: ruff format --check src tests airflow/dags
      - run: pytest --cov=finpulse --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -e .
      - run: finpulse schema --output /tmp/event-schema.json
      - run: finpulse local-demo --events 1000 --output /tmp/demo
      - uses: actions/upload-artifact@v7
        with:
          name: contract-and-demo-artifacts
          path: |
            /tmp/event-schema.json
            /tmp/demo/demo-summary.json
            /tmp/demo/quality-report.json

  containers:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        target: [api, producer, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: finpulse-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: 1.9.8}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform

