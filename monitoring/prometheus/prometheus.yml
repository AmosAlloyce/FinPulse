global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: finpulse-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: finpulse-spark-streaming
    static_configs:
      - targets: ["stream-processor:9108"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

